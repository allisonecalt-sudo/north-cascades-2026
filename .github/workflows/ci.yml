name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # lint also runs the privacy grep (conf/eTicket/seat/address) + link shape check
      - run: npm run lint
      # live photo-exists + dead-link resolve check — fails CI if a link rotted
      - run: npm run check:links:net
      - run: npm run build
